<style>
:root{--ink:#0B1437;--violet:#5B3FF0;--sky:#2F7BFF;--aqua:#00C2B8;--coral:#FF6B4A;--sun:#FFB020;--sand:#FAF7F2;--line:#e8e4f5;--muted:#5b6482}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--sand);color:#1e2745;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Sora,system-ui,sans-serif;color:var(--ink);margin:0}
button,input,select{font:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(90deg,var(--sky),var(--violet));color:#fff;box-shadow:0 6px 16px rgba(91,63,240,.28)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-accent{background:var(--coral);color:#fff}.btn-accent:hover{filter:brightness(.95)}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid rgba(91,63,240,.25)}.btn-ghost:hover{background:rgba(91,63,240,.06)}
.btn-white{background:#fff;color:var(--ink)}
.btn-line{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn-del{background:transparent;color:#d33;padding:4px 8px}
.input{width:100%;border:1px solid #cfd3e3;border-radius:12px;padding:10px 13px;background:#fff;font-size:14px}
.input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(91,63,240,.2);outline:0}
.card{background:#fff;border:1px solid rgba(91,63,240,.1);border-radius:22px;padding:20px;box-shadow:0 2px 10px rgba(91,63,240,.05)}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(91,63,240,.1);color:var(--violet);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.badge{background:var(--sun);color:var(--ink);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800}
.note{border:1px solid rgba(47,123,255,.25);background:rgba(47,123,255,.05);border-radius:12px;padding:10px 12px;font-size:13px;color:#33405f}
.note.warn{border-color:rgba(255,176,32,.6);background:rgba(255,176,32,.16);color:#6b4500}
.err{border:1px solid #f3b6b6;background:#fff1f1;color:#a02020;border-radius:12px;padding:10px 12px;font-size:13px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:Sora,system-ui,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em;text-decoration:none}
.brand img{width:38px;height:38px}

.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,20,55,.8),transparent 55%,rgba(11,20,55,.3));pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero header{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw}
.hero .copy{margin-top:auto;padding:0 5vw 9vh;animation:rise .8s ease-out both}
.hero h1{color:#fff;font-size:clamp(42px,8vw,86px);line-height:1.04;letter-spacing:-.03em;font-weight:800}
.grad{background:linear-gradient(90deg,var(--sun),var(--coral),var(--aqua));-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;margin-bottom:18px}
.hero p.lead{max-width:560px;font-size:18px;color:rgba(255,255,255,.88);margin:18px 0 28px}
.sec{padding:64px 5vw;max-width:1180px;margin:0 auto}
.sec h2{text-align:center;font-size:clamp(26px,4vw,38px);font-weight:800}
.ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
.step{background:var(--ink);color:#fff;border-radius:22px;padding:24px}
.step h3{color:#fff;margin-top:14px}.step p{color:rgba(255,255,255,.75);font-size:14px}
.step .n{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--coral));color:var(--ink);display:grid;place-items:center;font-family:Sora,system-ui,sans-serif;font-weight:800}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero .copy{animation:none}}
/* auth */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#0B1437,#3B2FB8 60%,#B2479C)}
.authcard{width:min(420px,100%);background:#fff;border-radius:26px;padding:28px}
.authcard label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
/* app shell */
.shell{display:flex;min-height:100vh}
.side{width:260px;background:var(--ink);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.side .brand{color:#fff;margin:0 6px 20px}
.side a.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;color:rgba(255,255,255,.72);font-weight:600;font-size:14px;text-decoration:none;margin-bottom:4px}
.side a.nav:hover{background:rgba(255,255,255,.1);color:#fff}
.side a.nav.on{background:linear-gradient(90deg,var(--sky),var(--violet));color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.menu{display:none;background:none;border:0;cursor:pointer;color:var(--ink)}
.page{max-width:1100px;margin:0 auto;padding:26px 22px 60px}
.page h1{font-size:clamp(24px,3.5vw,32px);font-weight:800}
.page .sub{color:var(--muted);margin:6px 0 22px;max-width:640px}
@media (max-width:900px){.side{position:fixed;z-index:40;left:0;transform:translateX(-100%);transition:.25s}.side.open{transform:none}.menu{display:block}.top{padding:12px 16px}}
.tile{display:flex;gap:14px;align-items:flex-start;text-decoration:none;transition:.15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(91,63,240,.14)}
.tile.main{background:linear-gradient(100deg,var(--ink),#2a1f8f 60%,var(--violet));border:0;grid-column:1/-1}
.tile.main h3,.tile.main p{color:#fff}.tile.main p{opacity:.8}
.tile h3{font-size:17px}.tile p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
/* planner */
.chat{max-width:720px}
.bubble{padding:11px 15px;border-radius:18px;max-width:85%;font-size:14.5px;margin:8px 0}
.bubble.q{background:#fff;border:1px solid var(--line);border-top-left-radius:6px}
.bubble.a{background:var(--violet);color:#fff;margin-left:auto;border-top-right-radius:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
#map{height:440px;border-radius:20px;z-index:0;background:#dfe6f3}
.stop{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stop:last-child{border:0}
.pinn{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.vy-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}
.vy-pin span{transform:rotate(45deg);color:#fff;font:700 12px Figtree,sans-serif}
.bar{height:10px;border-radius:99px;background:#ece9f8;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--violet));border-radius:99px}
.wx{text-align:center;padding:14px 10px}
.wx b{font-family:Sora,system-ui,sans-serif;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.chatbox{height:min(420px,55vh);overflow:auto;padding:6px 4px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.spin{width:16px;height:16px;border:2px solid #cfc8f5;border-top-color:var(--violet);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.side,.top,.noprint,.tabs{display:none!important}.page{padding:0}#map{height:300px}}
</style>

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ Voyara demo prototype ============
   Runs with no install. Data stays in this browser (localStorage). No real accounts.
   Live data (map tiles, weather, unknown-city search) needs internet; sample cities work offline. */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const COLORS = ['#5B3FF0', '#2F7BFF', '#00C2B8', '#FF6B4A', '#FFB020', '#C23DA0', '#3A8F5C', '#8A5A2B', '#5B6B7C', '#B23B3B'];

/* ---- storage (safe if blocked) ---- */
let mem = {};
const store = {
  get() { try { return JSON.parse(localStorage.getItem('vy_demo')) || mem; } catch { return mem; } },
  set(v) { mem = v; try { localStorage.setItem('vy_demo', JSON.stringify(v)); } catch {} }
};
let DB = store.get(); DB.users ||= {}; DB.data ||= {}; DB.session ||= null;
const save = () => store.set(DB);
const me = () => DB.session && DB.users[DB.session];
const D = () => (DB.data[DB.session] ||= { trips: [], expenses: [], packing: [], reminders: [], groups: [], limit: 0 });

/* ---- icons ---- */
const P = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/>',
  bookmark: '<path d="M6 3h12v18l-6-4-6 4z"/>',
  wallet: '<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 14h2"/>',
  bag: '<rect x="5" y="8" width="14" height="13" rx="4"/><path d="M9 8V5a3 3 0 0 1 6 0v3M9 15h6"/>',
  cloud: '<path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.5 1.5A3.5 3.5 0 0 1 16 18z"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 4 6"/>',
  bot: '<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/>',
  out: '<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  spark: '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
  send: '<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
};
const ic = (n, extra = '') => `<svg class="i" viewBox="0 0 24 24" ${extra}>${P[n]}</svg>`;
const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="38" height="38" aria-hidden="true"> <defs> <linearGradient id="vlbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1437"/><stop offset="1" stop-color="#3B2FB8"/></linearGradient> <linearGradient id="vlL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E0D0"/><stop offset="1" stop-color="#5B8CFF"/></linearGradient> <linearGradient id="vlR" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FF6B4A"/><stop offset="1" stop-color="#FFB020"/></linearGradient> <radialGradient id="vlS" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#FFB020"/></radialGradient> </defs> <rect width="120" height="120" rx="30" fill="url(#vlbg)"/> <circle cx="60" cy="55" r="12" fill="url(#vlS)"/> <path d="M26 36 L58 94" fill="none" stroke="url(#vlL)" stroke-width="15" stroke-linecap="round"/> <path d="M94 36 L58 94" fill="none" stroke="url(#vlR)" stroke-width="15" stroke-linecap="round"/> <path d="M28 24 C 42 -2, 80 -2, 92 18" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.1 7.2"/> <circle cx="94" cy="30" r="12" fill="#fff"/><circle cx="94" cy="30" r="4.8" fill="#0B1437"/> </svg>`;
const brand = (light = true) => `<a class="brand" href="#/" style="color:${light ? '#fff' : 'var(--ink)'}">${LOGO}<span>Voyara</span></a>`;

const findCity = q => { q = q.toLowerCase(); return Object.entries(CITIES).find(([k, c]) => q.includes(k) || c.name.toLowerCase().startsWith(q.trim()))?.[1]; };
const km = (a, b) => { const R = 6371, r = x => x * Math.PI / 180, dl = r(b.lat - a.lat), dn = r(b.lon - a.lon); const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

/* ---- network helpers (CORS-enabled public APIs) ---- */
const tmo = (url, opts = {}, ms = 9000) => fetch(url, { ...opts, signal: AbortSignal.timeout(ms) }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
async function geocode(q) {
  const d = await tmo('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(q));
  return d[0] ? { name: d[0].display_name.split(',').slice(0, 2).join(','), lat: +d[0].lat, lon: +d[0].lon } : null;
}
async function osmAttractions(c) {
  const q = `[out:json][timeout:20];(nwr["tourism"~"attraction|museum|viewpoint|zoo|theme_park"]["name"](around:15000,${c.lat},${c.lon});nwr["historic"~"castle|fort|monument|temple|ruins|palace"]["name"](around:15000,${c.lat},${c.lon}););out center 60;`;
  const d = await tmo('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) }, 20000);
  const seen = new Set();
  return d.elements.map(e => ({ n: e.tags.name, lat: e.lat ?? e.center?.lat, lon: e.lon ?? e.center?.lon })).filter(p => p.lat && p.n && !seen.has(p.n) && seen.add(p.n)).slice(0, 40).map(p => [p.n, p.lat, p.lon]);
}
async function forecast(lat, lon) {
  const d = await tmo(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`);
  return d.daily.time.map((t, i) => ({ date: t, code: d.daily.weathercode[i], max: Math.round(d.daily.temperature_2m_max[i]), min: Math.round(d.daily.temperature_2m_min[i]), rain: d.daily.precipitation_probability_max[i] ?? 0 }));
}
const wmo = c => c === 0 ? 'Clear' : c <= 3 ? 'Partly cloudy' : c <= 48 ? 'Fog' : c <= 67 ? 'Rain' : c <= 77 ? 'Snow' : c <= 82 ? 'Showers' : c >= 95 ? 'Thunderstorm' : 'Cloudy';

/* ---- trip generation ---- */
const PER_DAY = { budget: 2500, mid: 6000, premium: 14000 };
async function buildTrip(a) {
  let city = findCity(a.destination), stops, mode = 'sample';
  let center;
  if (city) { center = { lat: city.lat, lon: city.lon }; stops = city.stops; }
  else {
    mode = 'live';
    const g = await geocode(a.destination).catch(() => { throw new Error('Could not reach the map search. Check your internet, or try one of the sample cities: Jaipur, Goa, Manali, Udaipur, Kochi, Varanasi, Delhi, Mumbai.'); });
    if (!g) throw new Error(`Could not find "${a.destination}". Try a more specific name.`);
    center = { lat: g.lat, lon: g.lon }; city = { name: g.name, food: [], stay: [] };
    stops = await osmAttractions(center).catch(() => { throw new Error('The places service is busy right now. Please try again in a minute.'); });
    if (!stops.length) throw new Error('No named attractions found near there in OpenStreetMap. Try a larger city.');
  }
  const need = a.days * 3, pool = stops.map(([name, lat, lon]) => ({ name, lat, lon }));
  const picked = []; let cur = center; const left = pool.slice(0, Math.max(need + 4, 8));
  while (left.length && picked.length < need) { let bi = 0, bd = 1e9; left.forEach((p, i) => { const d = km(cur, p); if (d < bd) { bd = d; bi = i; } }); cur = left.splice(bi, 1)[0]; picked.push(cur); }
  let wx = null; try { wx = await forecast(center.lat, center.lon); } catch {}
  const days = Array.from({ length: a.days }, (_, i) => ({ title: 'Day ' + (i + 1), stops: picked.slice(i * 3, i * 3 + 3), eat: city.food.slice(i * 2, i * 2 + 2), weather: wx ? wx[i] || null : null }));
  const pp = a.budget / a.people / a.days, level = a.budget && pp < 3500 ? 'budget' : a.budget && pp > 10000 ? 'premium' : 'mid';
  const per = PER_DAY[level] * a.days;
  return { destination: city.name, center, days, people: a.people, style: a.style, companions: a.companions, stays: city.stay, mode, budget: a.budget, notes: a.notes,
    estimate: { level, per, total: per * a.people }, summary: `${a.days} days in ${city.name} for ${a.people} (${a.companions}), a ${a.style} trip. Stops are ordered so nearby places share a day.` };
}
const dayKm = (it, d) => { let t = 0, prev = it.center; d.stops.forEach(s => { t += km(prev, s); prev = s; }); return t; };
function toText(it, title) {
  const L = [`${title || 'Voyara trip'} - ${it.destination}`, `Travellers: ${it.people}`, ''];
  it.days.forEach(d => { L.push(d.title + (d.weather ? ` (forecast ${d.weather.min}-${d.weather.max} C, rain ${d.weather.rain}%)` : '')); d.stops.forEach((s, i) => L.push(`  ${i + 1}. ${s.name}`)); if (d.eat.length) L.push('  Food ideas: ' + d.eat.join(', ')); L.push(`  Approx. travel: ${dayKm(it, d).toFixed(1)} km straight-line`, ''); });
  if (it.stays.length) L.push('Where to stay (areas): ' + it.stays.join('; '), '');
  L.push(`Rough estimate: ${inr(it.estimate.per)} per person (${inr(it.estimate.total)} total). Planning estimate only, not live prices.`);
  return L.join('\n');
}

  ${none ? '<div class="err">No stops found for this place.</div>' : ''}
  <div class="split"><div>${days.map(d => { const di = it.days.indexOf(d); return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h3 style="font-size:17px">${d.title}</h3><span class="muted" style="font-size:12.5px">~${dayKm(it, d).toFixed(1)} km straight-line</span></div><div style="margin:6px 0">${wx(d)}</div>
  ${d.stops.map((s, i) => `<div class="stop"><span class="pinn" style="background:${COLORS[di % 10]}">${i + 1}</span><div style="flex:1"><b>${esc(s.name)}</b></div><button class="btn btn-del btn-sm noprint" data-act="rmstop" data-di="${di}" data-i="${i}" aria-label="Remove ${esc(s.name)}">Remove</button></div>`).join('') || '<p class="muted">No stops left.</p>'}
  ${d.eat.length ? `<p style="font-size:13.5px;margin:10px 0 0"><b>Food ideas:</b> ${d.eat.map(esc).join(', ')}</p>` : ''}</div>`; }).join('')}
  ${it.stays.length ? `<div class="card" style="margin-bottom:14px"><h3 style="font-size:16px">Where to stay (areas)</h3><p style="font-size:14px;margin:8px 0 0">${it.stays.map(esc).join(' · ')}</p></div>` : ''}
  <div class="card"><h3 style="font-size:16px">Rough budget estimate</h3><p style="margin:8px 0 2px"><b style="font-size:22px;font-family:Sora">${inr(it.estimate.per)}</b> per person · ${inr(it.estimate.total)} total <span class="chip">${it.estimate.level}</span></p><p class="muted" style="font-size:12.5px;margin:0">Planning estimate only, not live prices. Distances are straight-line.</p></div></div>
  <div style="position:sticky;top:76px"><div id="map" aria-label="Trip map"></div><p class="muted" style="font-size:12px;margin:6px 4px">Map data © OpenStreetMap contributors</p></div></div>`;
}
function trips() {
  const t = D().trips;
  return shell('trips', t.length ? `<div class="grid g2">${t.map((x, i) => `<div class="card"><h3 style="font-size:18px">${esc(x.title)}</h3><p class="muted" style="font-size:13px;margin:6px 0 14px">${x.itinerary.days.length} days · ${x.itinerary.days.reduce((a, d) => a + d.stops.length, 0)} stops · saved ${esc(x.date)}</p><div class="row"><button class="btn btn-primary btn-sm" data-act="open" data-i="${i}">Open</button><button class="btn btn-ghost btn-sm" data-act="dltrip" data-i="${i}">Download</button><button class="btn btn-del btn-sm" data-act="rmtrip" data-i="${i}">Delete</button></div></div>`).join('')}</div>` : '<div class="card"><p>No saved trips yet.</p><a class="btn btn-primary" href="#/app/plan">Plan a trip</a></div>', 'My trips', 'Open, edit and download your saved trips.');
}
function budget() {
  const d = D(), tot = d.expenses.reduce((a, e) => a + e.amount, 0), cats = {};
  d.expenses.forEach(e => cats[e.category] = (cats[e.category] || 0) + e.amount);
  const pct = d.limit ? Math.min(100, tot / d.limit * 100) : 0;
  const body = `<div class="grid g2"><div class="card"><h3 style="font-size:17px">Add expense</h3><form id="expform" style="display:grid;gap:10px;margin-top:12px"><input class="input" id="et" placeholder="What did you spend on?" required><div class="row"><input class="input" style="flex:1" id="ea" type="number" min="1" placeholder="Amount ₹" required><select class="input" style="flex:1" id="ec">${['Stay', 'Food', 'Transport', 'Activities', 'Shopping', 'Other'].map(c => `<option>${c}</option>`).join('')}</select></div><button class="btn btn-primary">Add</button></form></div>
  <div class="card"><h3 style="font-size:17px">Total spent</h3><p style="font-family:Sora,system-ui,sans-serif;font-size:30px;font-weight:800;margin:8px 0">${inr(tot)}</p><form id="limform" class="row"><input class="input" style="flex:1" id="lim" type="number" min="0" placeholder="Budget limit ₹" value="${d.limit || ''}"><button class="btn btn-ghost">Set</button></form>${d.limit ? `<div class="bar" style="margin-top:12px"><i style="width:${pct}%;${tot > d.limit ? 'background:var(--coral)' : ''}"></i></div><p style="font-size:13px;margin:6px 0 0">${tot > d.limit ? `<b style="color:#c0392b">Over budget by ${inr(tot - d.limit)}</b>` : `${inr(d.limit - tot)} left`}</p>` : ''}</div></div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><h3 style="font-size:17px">By category</h3>${Object.entries(cats).map(([c, v]) => `<div style="margin:12px 0"><div class="row" style="justify-content:space-between;font-size:13.5px"><b>${esc(c)}</b><span>${inr(v)}</span></div><div class="bar"><i style="width:${v / tot * 100}%"></i></div></div>`).join('') || '<p class="muted" style="font-size:14px">Nothing yet.</p>'}</div>
  <div class="card"><h3 style="font-size:17px">Expenses</h3>${d.expenses.map((e, i) => `<div class="stop"><div style="flex:1"><b>${esc(e.title)}</b><div class="muted" style="font-size:12.5px">${esc(e.category)} · ${esc(e.date)}</div></div><b>${inr(e.amount)}</b><button class="btn btn-del btn-sm" data-act="rmexp" data-i="${i}">×</button></div>`).join('') || '<p class="muted" style="font-size:14px">No expenses yet.</p>'}</div></div>`;
  return shell('budget', body, 'Budget & expenses', 'Track what you spend on the trip.');
}
const ESSENTIALS = ['ID and tickets', 'Phone and charger', 'Power bank', 'Light layers', 'Comfortable shoes', 'Basic medicines', 'Refillable water bottle', 'Rain jacket', 'Sunscreen', 'Cash and cards'];
function packing() {
  const p = D().packing, done = p.filter(x => x.c).length;
  const body = `<div class="card"><form id="packform" class="row"><input class="input" style="flex:1;min-width:200px" id="pi" placeholder="Add an item" required><button class="btn btn-primary">Add</button><button type="button" class="btn btn-ghost" data-act="essentials">Add essentials</button></form>
  <div class="bar" style="margin:16px 0 4px"><i style="width:${p.length ? done / p.length * 100 : 0}%"></i></div><p class="muted" style="font-size:13px;margin:0 0 8px">${done} of ${p.length} packed</p>
  ${p.map((x, i) => `<div class="stop"><input type="checkbox" data-act="pack" data-i="${i}" ${x.c ? 'checked' : ''} id="pk${i}"><label for="pk${i}" style="flex:1;${x.c ? 'text-decoration:line-through;opacity:.5' : ''}">${esc(x.t)}</label><button class="btn btn-del btn-sm" data-act="rmpack" data-i="${i}">×</button></div>`).join('') || '<p class="muted" style="font-size:14px">Your list is empty.</p>'}</div>`;
  return shell('packing', body, 'Packing list', 'Tick things off as you pack.');
}
function weather() {
  const w = UI.wx;
  const body = `<div class="card"><form id="wxform" class="row"><input class="input" style="flex:1;min-width:200px" id="wq" placeholder="City, e.g. Manali" required value="${esc(w?.q || '')}"><button class="btn btn-primary">Get forecast</button></form></div>
  ${w?.loading ? '<p><span class="spin"></span> Loading...</p>' : ''}${w?.err ? `<div class="err" style="margin-top:14px">${esc(w.err)}</div>` : ''}
  ${w?.days ? `<h3 style="margin:20px 0 10px">${esc(w.name)}</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${w.days.map(d => `<div class="card wx"><div class="muted" style="font-size:12.5px">${new Date(d.date + 'T00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })}</div><b>${wmo(d.code)}</b><div style="font-size:18px;font-weight:700;margin:6px 0">${d.max}° <span class="muted" style="font-weight:500">/ ${d.min}°</span></div><span class="chip">Rain ${d.rain}%</span></div>`).join('')}</div>${w.days.some(d => d.rain >= 60) ? '<div class="note warn" style="margin-top:14px">Rain is likely on some days. Plan museums, markets and cafes for those days.</div>' : ''}` : ''}
  <p class="muted" style="font-size:12.5px;margin-top:14px">Forecast from Open-Meteo (needs internet).</p>`;
  return shell('weather', body, 'Weather forecast', 'Check the week ahead for any place.');
}
function group() {
  const gs = D().groups, g = gs[UI.gsel] || gs[0];
  let body = `<div class="card"><form id="grpform" class="row"><input class="input" style="flex:1;min-width:200px" id="gn" placeholder="New group name, e.g. Goa Gang" required><button class="btn btn-primary">Create group</button></form></div>`;
  if (g) {
    const bal = {}; g.members.forEach(m => bal[m] = 0);
    const tot = g.expenses.reduce((a, e) => a + e.amount, 0), share = g.members.length ? tot / g.members.length : 0;
    g.expenses.forEach(e => bal[e.by] += e.amount); g.members.forEach(m => bal[m] -= share);
    const cr = Object.entries(bal).filter(([, v]) => v > 0.5).map(([n, v]) => [n, v]).sort((a, b) => b[1] - a[1]), de = Object.entries(bal).filter(([, v]) => v < -0.5).map(([n, v]) => [n, -v]).sort((a, b) => b[1] - a[1]);
    const pay = []; let i = 0, j = 0; while (i < de.length && j < cr.length) { const x = Math.min(de[i][1], cr[j][1]); pay.push(`${de[i][0]} pays ${cr[j][0]} ${inr(x)}`); de[i][1] -= x; cr[j][1] -= x; if (de[i][1] < 0.5) i++; if (cr[j][1] < 0.5) j++; }
    body += `<div class="tabs">${gs.map((x, k) => `<button class="tab ${x === g ? 'on' : ''}" data-act="gsel" data-i="${k}">${esc(x.name)}</button>`).join('')}</div>
    <div class="grid g2"><div class="card"><h3 style="font-size:17px">Members</h3><div class="row" style="margin:10px 0">${g.members.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</div><form id="memform" class="row"><input class="input" style="flex:1" id="mn" placeholder="Add a friend's name" required><button class="btn btn-ghost">Add</button></form></div>
    <div class="card"><h3 style="font-size:17px">Vote: where to go?</h3>${g.options.map((o, k) => `<div class="stop"><div style="flex:1"><b>${esc(o.name)}</b></div><span class="chip">${o.votes} vote${o.votes === 1 ? '' : 's'}</span><button class="btn btn-ghost btn-sm" data-act="vote" data-i="${k}">Vote</button></div>`).join('')}<form id="optform" class="row" style="margin-top:10px"><input class="input" style="flex:1" id="on" placeholder="Add an option" required><button class="btn btn-ghost">Add</button></form></div></div>
    <div class="grid g2" style="margin-top:16px"><div class="card"><h3 style="font-size:17px">Add shared expense</h3><form id="gexpform" style="display:grid;gap:10px;margin-top:12px"><input class="input" id="gd" placeholder="What for?" required><div class="row"><input class="input" style="flex:1" id="ga" type="number" min="1" placeholder="Amount ₹" required><select class="input" style="flex:1" id="gb">${g.members.map(m => `<option>${esc(m)}</option>`).join('')}</select></div><button class="btn btn-primary">Add (paid by)</button></form>
    ${g.expenses.map((e, k) => `<div class="stop"><div style="flex:1">${esc(e.desc)}<div class="muted" style="font-size:12.5px">paid by ${esc(e.by)}</div></div><b>${inr(e.amount)}</b><button class="btn btn-del btn-sm" data-act="rmgexp" data-i="${k}">×</button></div>`).join('')}</div>
    <div class="card"><h3 style="font-size:17px">Who owes whom</h3><p class="muted" style="font-size:13px;margin:4px 0 10px">Total ${inr(tot)} · ${inr(share)} each</p>${pay.map(p => `<div class="stop"><b>${esc(p)}</b></div>`).join('') || '<p class="muted" style="font-size:14px">All settled.</p>'}</div></div>`;
  }
  return shell('group', body, 'Group travel', 'Vote on options and split costs fairly.');
}
function assistant() {
  const body = `<div class="card" style="max-width:720px"><div class="note warn" style="margin-bottom:10px"><span class="badge">DEMO</span> Simple keyword tips. The full project connects a real AI model.</div><div class="chatbox" id="chatbox"><div class="bubble q">Hi! Ask me about packing, weather, safety or budget.</div>${UI.chat.map(m => `<div class="bubble ${m.r === 'u' ? 'a' : 'q'}">${esc(m.t)}</div>`).join('')}</div>
  <form id="chatform" class="row" style="margin-top:10px"><input class="input" style="flex:1" id="cm" placeholder="Ask something..." required><button class="btn btn-primary">${ic('send')}</button></form></div>`;
  return shell('assistant', body, 'Travel assistant', 'Quick tips for your trip.');
}
function reply(t) {
  t = t.toLowerCase(); const dest = UI.lastDest ? ` for ${UI.lastDest}` : '';
  if (/pack/.test(t)) return `Packing basics${dest}: ID and tickets, phone and charger, power bank, light layers, comfortable shoes, basic medicines, a refillable bottle and a rain jacket. The Packing list page can add these for you.`;
  if (/rain|weather/.test(t)) return 'Open the Weather page for a 7-day forecast. If rain is likely, plan museums, markets and cafes, and keep viewpoints for dry days.';
  if (/safe|emergency|police|hospital/.test(t)) return 'In India dial 112 for emergencies. Share your live location with someone you trust, keep copies of your documents and note the nearest hospital to your stay.';
  if (/budget|cost|expens|money/.test(t)) return 'A rough split: 35% stay, 25% food, 20% transport, 15% activities, 5% buffer. Track real spending on the Budget page.';
  return 'I am in demo mode, so I only know general tips. Try asking about packing, weather, safety or budget.';
}

/* ---- map ---- */
let map = null;
function drawMap() {
  const el = $('#map'); if (map) { try { map.remove(); } catch {} map = null; } if (!el || !UI.current) return;
  if (typeof L === 'undefined') { el.innerHTML = '<div class="note" style="margin:16px">Map library could not load (check your internet connection).</div>'; return; }
  map = L.map(el, { scrollWheelZoom: false }).setView([UI.current.center.lat, UI.current.center.lon], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  const pts = [], list = UI.day === 'all' ? UI.current.days.map((d, i) => [d, i]) : [[UI.current.days[UI.day], UI.day]];
  list.forEach(([d, di]) => { const line = []; d.stops.forEach((s, i) => { const icon = L.divIcon({ className: '', html: `<div class="vy-pin" style="background:${COLORS[di % 10]}"><span>${i + 1}</span></div>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] }); L.marker([s.lat, s.lon], { icon }).bindPopup(`<b>${esc(s.name)}</b><br>${d.title}`).addTo(map); pts.push([s.lat, s.lon]); line.push([s.lat, s.lon]); }); if (line.length > 1) L.polyline(line, { color: COLORS[di % 10], weight: 4, opacity: .8, dashArray: '8 8' }).addTo(map); });
  if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30] }); else if (pts.length === 1) map.setView(pts[0], 13);
  setTimeout(() => map && map.invalidateSize(), 50);
}

/* ---- router ---- */
function render() {
  const h = location.hash.replace(/^#\/?/, ''), app = $('#app');
  const [a, b] = h.split('/');
  if (a === 'app') {
    if (!me()) { location.hash = '#/login'; return; }
    const v = { dashboard, plan: planner, trips, budget, packing, weather, group, assistant }[b || 'dashboard'] || dashboard;
    app.innerHTML = v();
    if (v === planner) drawMap();
  } else if (a === 'login' || a === 'signup') { if (me()) { location.hash = '#/app/dashboard'; return; } app.innerHTML = auth(a); }
  else app.innerHTML = landing();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { UI.menu = false; render(); });
const rerender = () => { const y = scrollY; render(); scrollTo(0, y); };

/* ---- events ---- */
async function submitWizard(val, label) {
  const w = UI.wiz, q = QS[w.step]; UI.err = '';
  w.ans[q.k] = q.t === 'number' ? Number(val) : val; if (label) w.ans[q.k + '_l'] = label;
  if (q.t === 'number' && (isNaN(w.ans[q.k]) || (q.min != null && w.ans[q.k] < q.min) || (q.max && w.ans[q.k] > q.max))) { UI.err = `Please enter a number${q.min != null ? ' from ' + q.min : ''}${q.max ? ' to ' + q.max : ''}.`; return rerender(); }
  if (w.step < QS.length - 1) { w.step++; return rerender(); }
  UI.busy = true; rerender();
  try {
    const a = w.ans; UI.current = await buildTrip({ destination: String(a.destination).trim(), days: a.days, budget: a.budget || 0, people: a.people, style: a.style, companions: a.companions, notes: a.notes || '' });
    UI.lastDest = UI.current.destination; UI.curId = null; UI.day = 'all';
  } catch (e) { UI.err = e.message; w.step = 0; w.ans = {}; }
  UI.busy = false; rerender();
}
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target.id, v = id => $('#' + id)?.value.trim();
  if (f === 'authform') {
    const mode = e.target.dataset.mode, em = v('em').toLowerCase(), pw = v('pw'), err = $('#autherr');
    if (mode === 'signup') { if (DB.users[em]) { err.innerHTML = '<div class="err">An account with this email already exists.</div>'; return; } DB.users[em] = { name: v('nm'), pw }; }
    else if (!DB.users[em] || DB.users[em].pw !== pw) { err.innerHTML = '<div class="err">Incorrect email or password.</div>'; return; }
    DB.session = em; save(); location.hash = '#/app/dashboard';
  } else if (f === 'wizform') { const x = v('wv'); submitWizard(x, null); }
  else if (f === 'remform') { D().reminders.push({ title: v('rt'), date: v('rd'), done: false }); save(); rerender(); }
  else if (f === 'expform') { D().expenses.unshift({ title: v('et'), amount: +v('ea'), category: v('ec'), date: new Date().toISOString().slice(0, 10) }); save(); rerender(); }
  else if (f === 'limform') { D().limit = +v('lim') || 0; save(); rerender(); }
  else if (f === 'packform') { D().packing.push({ t: v('pi'), c: false }); save(); rerender(); }
  else if (f === 'wxform') {
    const q = v('wq'); UI.wx = { q, loading: true }; rerender();
    try { let c = findCity(q); let g = c ? { name: c.name, lat: c.lat, lon: c.lon } : await geocode(q); if (!g) throw new Error(`Could not find "${q}".`); UI.wx = { q, name: g.name, days: await forecast(g.lat, g.lon) }; }
    catch (er) { UI.wx = { q, err: er.message.startsWith('Could not find') ? er.message : 'Could not load the forecast. Check your internet connection and try again.' }; }
    rerender();
  }
  else if (f === 'grpform') { D().groups.push({ name: v('gn'), members: [me().name], options: [], expenses: [] }); UI.gsel = D().groups.length - 1; save(); rerender(); }
  else if (f === 'memform') { const g = D().groups[UI.gsel]; const n = v('mn'); if (!g.members.includes(n)) g.members.push(n); save(); rerender(); }
  else if (f === 'optform') { D().groups[UI.gsel].options.push({ name: v('on'), votes: 0 }); save(); rerender(); }
  else if (f === 'gexpform') { D().groups[UI.gsel].expenses.push({ desc: v('gd'), amount: +v('ga'), by: v('gb') }); save(); rerender(); }
  else if (f === 'chatform') { const t = v('cm'); UI.chat.push({ r: 'u', t }, { r: 'b', t: reply(t) }); rerender(); const b = $('#chatbox'); if (b) b.scrollTop = b.scrollHeight; }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, i = +b.dataset.i, d = D();
  const dl = (name, txt) => { const u = URL.createObjectURL(new Blob([txt], { type: 'text/plain' })); const l = document.createElement('a'); l.href = u; l.download = name; l.click(); URL.revokeObjectURL(u); };
  if (a === 'menu') { UI.menu = !UI.menu; $('.side').classList.toggle('open', UI.menu); }
  else if (a === 'logout') { DB.session = null; save(); UI.current = null; location.hash = '#/'; }
  else if (a === 'ans') submitWizard(b.dataset.v, b.dataset.l);
  else if (a === 'skip') submitWizard('', null);
  else if (a === 'restart') { UI.current = null; UI.wiz = { step: 0, ans: {} }; UI.err = ''; rerender(); }
  else if (a === 'day') { UI.day = b.dataset.d === 'all' ? 'all' : +b.dataset.d; rerender(); }
  else if (a === 'rmstop') { UI.current.days[+b.dataset.di].stops.splice(i, 1); if (UI.curId != null && d.trips[UI.curId]) { d.trips[UI.curId].itinerary = UI.current; save(); } rerender(); }
  else if (a === 'savetrip') { const entry = { title: UI.current.destination.split(',')[0] + ' trip', date: new Date().toISOString().slice(0, 10), itinerary: UI.current }; if (UI.curId != null && d.trips[UI.curId]) d.trips[UI.curId] = entry; else { d.trips.unshift(entry); UI.curId = 0; } save(); toast('Trip saved'); }
  else if (a === 'dl') dl('voyara-trip.txt', toText(UI.current));
  else if (a === 'print') window.print();
  else if (a === 'open') { UI.current = structuredClone(d.trips[i].itinerary); UI.curId = i; UI.day = 'all'; location.hash = '#/app/plan'; rerender(); }
  else if (a === 'dltrip') dl('voyara-trip.txt', toText(d.trips[i].itinerary, d.trips[i].title));
  else if (a === 'rmtrip') { d.trips.splice(i, 1); UI.curId = null; save(); rerender(); }
  else if (a === 'rmexp') { d.expenses.splice(i, 1); save(); rerender(); }
  else if (a === 'pack') { d.packing[i].c = !d.packing[i].c; save(); rerender(); }
  else if (a === 'rmpack') { d.packing.splice(i, 1); save(); rerender(); }
  else if (a === 'essentials') { ESSENTIALS.forEach(t => { if (!d.packing.some(x => x.t === t)) d.packing.push({ t, c: false }); }); save(); rerender(); }
  else if (a === 'remdone') { d.reminders[i].done = !d.reminders[i].done; save(); rerender(); }
  else if (a === 'remdel') { d.reminders.splice(i, 1); save(); rerender(); }
  else if (a === 'gsel') { UI.gsel = i; rerender(); }
  else if (a === 'vote') { d.groups[UI.gsel].options[i].votes++; save(); rerender(); }
  else if (a === 'rmgexp') { d.groups[UI.gsel].expenses.splice(i, 1); save(); rerender(); }
});
render();
</script>
